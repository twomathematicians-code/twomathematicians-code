<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" font-family="'Caveat','Comic Sans MS','Segoe Script',cursive" role="img" aria-label="Hand-drawn normal distribution and histogram in motion">
  <defs>
    <pattern id="grid-di" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#c9d6e8" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <pattern id="grid-major-di" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0 L0 0 0 100" fill="none" stroke="#a9bdd6" stroke-width="0.9" opacity="0.4"/>
    </pattern>
    <filter id="ink-di" x="-3%" y="-3%" width="106%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.015 0.022" numOctaves="2" seed="37" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.0"/>
    </filter>
  </defs>

  <rect width="460" height="280" fill="#f7f5ef"/>
  <rect width="460" height="280" fill="url(#grid-di)"/>
  <rect width="460" height="280" fill="url(#grid-major-di)"/>

  <g filter="url(#ink-di)">
    <!-- axes -->
    <path d="M50 240 L50 40" fill="none" stroke="#2b3a55" stroke-width="1.6"/>
    <path d="M50 240 L430 240" fill="none" stroke="#2b3a55" stroke-width="1.6"/>
    <text x="28" y="46" fill="#2b3a55" font-size="15">density</text>
    <text x="392" y="262" fill="#2b3a55" font-size="15">value</text>

    <!-- histogram bars (grow / shrink subtly) -->
    <g fill="#a9bdd6" opacity="0.6" stroke="#3b5998" stroke-width="1">
      <rect x="72" y="220" width="28" height="20"><animate attributeName="height" values="20;26;20" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="220;214;220" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="104" y="190" width="28" height="50"><animate attributeName="height" values="50;58;50" dur="3s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="y" values="190;182;190" dur="3s" begin="0.2s" repeatCount="indefinite"/></rect>
      <rect x="136" y="140" width="28" height="100"><animate attributeName="height" values="100;108;100" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="140;132;140" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
      <rect x="168" y="80" width="28" height="160"><animate attributeName="height" values="160;168;160" dur="3s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="80;72;80" dur="3s" begin="0.6s" repeatCount="indefinite"/></rect>
      <rect x="200" y="70" width="28" height="170"><animate attributeName="height" values="170;178;170" dur="3s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="70;62;70" dur="3s" begin="0.8s" repeatCount="indefinite"/></rect>
      <rect x="232" y="90" width="28" height="150"><animate attributeName="height" values="150;158;150" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="y" values="90;82;90" dur="3s" begin="1s" repeatCount="indefinite"/></rect>
      <rect x="264" y="130" width="28" height="110"><animate attributeName="height" values="110;118;110" dur="3s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="130;122;130" dur="3s" begin="1.2s" repeatCount="indefinite"/></rect>
      <rect x="296" y="180" width="28" height="60"><animate attributeName="height" values="60;68;60" dur="3s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="180;172;180" dur="3s" begin="1.4s" repeatCount="indefinite"/></rect>
      <rect x="328" y="214" width="28" height="26"><animate attributeName="height" values="26;32;26" dur="3s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="214;208;214" dur="3s" begin="1.6s" repeatCount="indefinite"/></rect>
    </g>

    <!-- normal curve over the histogram (drawn in) -->
    <path d="M60 232 C 120 226, 150 200, 180 90 C 200 40, 260 40, 280 90 C 310 200, 340 226, 400 232"
          fill="none" stroke="#c0392b" stroke-width="2.6" stroke-linecap="round"
          stroke-dasharray="700" stroke-dashoffset="700">
      <animate attributeName="stroke-dashoffset" from="700" to="0" dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- mean line -->
    <line x1="230" y1="70" x2="230" y2="240" stroke="#1e6b3a" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.8"/>
    <text x="234" y="62" fill="#1e6b3a" font-size="16">μ</text>
    <text x="250" y="250" fill="#7a8699" font-size="14">σ</text>
  </g>

  <text x="20" y="32" fill="#2b3a55" font-size="20" font-weight="bold">distribution</text>
</svg>
