<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'Inter','Segoe UI',system-ui,sans-serif" role="img" aria-label="LLM attention flow with token embeddings">
  <defs>
    <radialGradient id="tok-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- clean white background -->
  <rect width="900" height="300" fill="#ffffff"/>

  <!-- input tokens -->
  <g>
    <rect x="40" y="120" width="56" height="40" rx="8" fill="#f8fafc" stroke="#6366F1" stroke-width="1.4"/>
    <text x="68" y="146" text-anchor="middle" fill="#1e293b" font-size="14">the</text>
    <rect x="104" y="120" width="56" height="40" rx="8" fill="#f8fafc" stroke="#6366F1" stroke-width="1.4"/>
    <text x="132" y="146" text-anchor="middle" fill="#1e293b" font-size="14">model</text>
    <rect x="168" y="120" width="56" height="40" rx="8" fill="#f8fafc" stroke="#6366F1" stroke-width="1.4"/>
    <text x="196" y="146" text-anchor="middle" fill="#1e293b" font-size="14">learns</text>
  </g>
  <text x="100" y="184" fill="#64748b" font-size="12">tokens</text>

  <!-- embedding arrows -->
  <g stroke="#3b82f6" stroke-width="1.2" fill="none" opacity="0.4">
    <line x1="68" y1="160" x2="330" y2="100"/>
    <line x1="132" y1="160" x2="330" y2="130"/>
    <line x1="196" y1="160" x2="330" y2="160"/>
  </g>

  <!-- attention weights -->
  <g stroke="#8b5cf6" stroke-width="1.2" fill="none" opacity="0.45" stroke-dasharray="4 4">
    <path d="M330 100 Q 430 60 560 110"/>
    <path d="M330 130 Q 430 110 560 130"/>
    <path d="M330 160 Q 430 170 560 150"/>
  </g>

  <!-- attention block -->
  <rect x="330" y="78" width="120" height="100" rx="10" fill="#f8fafc" stroke="#6366F1" stroke-width="1.8"/>
  <text x="390" y="116" text-anchor="middle" fill="#6366F1" font-size="14" font-weight="600">multi-head</text>
  <text x="390" y="138" text-anchor="middle" fill="#6366F1" font-size="14" font-weight="600">attention</text>
  <text x="390" y="200" fill="#64748b" font-size="12">softmax(QKᵀ/&#8730;d)</text>

  <!-- arrow to FFN -->
  <line x1="450" y1="128" x2="490" y2="128" stroke="#1e293b" stroke-width="1.4"/>
  <polygon points="490,128 482,124 482,132" fill="#1e293b"/>

  <!-- FFN block -->
  <rect x="490" y="92" width="90" height="72" rx="10" fill="#f8fafc" stroke="#22c55e" stroke-width="1.5"/>
  <text x="535" y="122" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="600">FFN</text>
  <text x="535" y="144" text-anchor="middle" fill="#22c55e" font-size="12">+ residual</text>

  <!-- arrow to output -->
  <line x1="580" y1="128" x2="660" y2="128" stroke="#1e293b" stroke-width="1.4"/>
  <polygon points="660,128 652,124 652,132" fill="#1e293b"/>

  <!-- next-token glow -->
  <circle cx="700" cy="128" r="34" fill="url(#tok-glow)">
    <animate attributeName="r" values="30;40;30" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <rect x="668" y="108" width="64" height="40" rx="8" fill="#f8fafc" stroke="#6366F1" stroke-width="1.8"/>
  <text x="700" y="134" text-anchor="middle" fill="#1e293b" font-size="13">patterns</text>
  <text x="700" y="176" fill="#64748b" font-size="12">next token &#8593;</text>

  <!-- probability bar -->
  <g>
    <rect x="760" y="92" width="14" height="80" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="762" y="152" width="10" height="18" fill="#6366F1">
      <animate attributeName="height" values="6;40;18;6" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="164;130;152;164" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="752" y="190" fill="#64748b" font-size="12">P(t)</text>
  </g>

  <!-- title -->
  <text x="24" y="34" fill="#1e293b" font-size="16" font-weight="600" letter-spacing="0.5">ATTENTION MECHANISM</text>
  <text x="24" y="288" fill="#64748b" font-size="12">tokens &rarr; embeddings &rarr; attention &rarr; next token</text>
</svg>
