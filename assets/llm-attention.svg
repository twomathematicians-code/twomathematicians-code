<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'Caveat','Comic Sans MS','Segoe Script',cursive" role="img" aria-label="Hand-drawn LLM attention flow with token embeddings">
  <defs>
    <pattern id="grid-ll" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 L0 0 0 22" fill="none" stroke="#c9d6e8" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <pattern id="grid-major-ll" width="110" height="110" patternUnits="userSpaceOnUse">
      <path d="M110 0 L0 0 0 110" fill="none" stroke="#a9bdd6" stroke-width="0.9" opacity="0.4"/>
    </pattern>
    <filter id="ink-ll" x="-3%" y="-3%" width="106%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.014 0.02" numOctaves="2" seed="29" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.1"/>
    </filter>
    <radialGradient id="tok-ll" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="300" fill="#f7f5ef"/>
  <rect width="900" height="300" fill="url(#grid-ll)"/>
  <rect width="900" height="300" fill="url(#grid-major-ll)"/>
  <ellipse cx="60" cy="40" rx="40" ry="26" fill="#d9c08a" opacity="0.10"/>

  <g filter="url(#ink-ll)">
    <!-- input tokens -->
    <g>
      <rect x="40" y="120" width="56" height="40" rx="8" fill="#fff" stroke="#2b3a55" stroke-width="1.8"/>
      <text x="68" y="146" text-anchor="middle" fill="#2b3a55" font-size="18">the</text>
      <rect x="104" y="120" width="56" height="40" rx="8" fill="#fff" stroke="#2b3a55" stroke-width="1.8"/>
      <text x="132" y="146" text-anchor="middle" fill="#2b3a55" font-size="18">model</text>
      <rect x="168" y="120" width="56" height="40" rx="8" fill="#fff" stroke="#2b3a55" stroke-width="1.8"/>
      <text x="196" y="146" text-anchor="middle" fill="#2b3a55" font-size="18">learns</text>
    </g>
    <text x="100" y="186" fill="#7a8699" font-size="15">tokens</text>

    <!-- embedding arrows to attention block -->
    <g stroke="#3b5998" stroke-width="1.4" fill="none" opacity="0.6">
      <line x1="68" y1="160" x2="330" y2="100"/>
      <line x1="132" y1="160" x2="330" y2="130"/>
      <line x1="196" y1="160" x2="330" y2="160"/>
    </g>
    <!-- attention weights (dashed, varying) -->
    <g stroke="#7c5cff" stroke-width="1.2" fill="none" opacity="0.55" stroke-dasharray="4 4">
      <path d="M330 100 Q 430 60 560 110"/>
      <path d="M330 130 Q 430 110 560 130"/>
      <path d="M330 160 Q 430 170 560 150"/>
    </g>

    <!-- attention block -->
    <rect x="330" y="78" width="120" height="100" rx="10" fill="#fff" stroke="#7c5cff" stroke-width="2.2"/>
    <text x="390" y="118" text-anchor="middle" fill="#7c5cff" font-size="18">multi-head</text>
    <text x="390" y="142" text-anchor="middle" fill="#7c5cff" font-size="18">attention</text>
    <text x="390" y="200" fill="#7a8699" font-size="14">softmax(QKᵀ/√d)</text>

    <!-- arrow to FFN -->
    <line x1="450" y1="128" x2="490" y2="128" stroke="#2b3a55" stroke-width="1.6"/>
    <polygon points="490,128 482,124 482,132" fill="#2b3a55"/>

    <!-- FFN block -->
    <rect x="490" y="92" width="90" height="72" rx="10" fill="#fff" stroke="#1e6b3a" stroke-width="2"/>
    <text x="535" y="124" text-anchor="middle" fill="#1e6b3a" font-size="17">FFN</text>
    <text x="535" y="146" text-anchor="middle" fill="#1e6b3a" font-size="14">+ residual</text>

    <!-- arrow to output -->
    <line x1="580" y1="128" x2="660" y2="128" stroke="#2b3a55" stroke-width="1.6"/>
    <polygon points="660,128 652,124 652,132" fill="#2b3a55"/>

    <!-- next-token glow -->
    <circle cx="700" cy="128" r="34" fill="url(#tok-ll)">
      <animate attributeName="r" values="30;40;30" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="668" y="108" width="64" height="40" rx="8" fill="#fff" stroke="#7c5cff" stroke-width="2.2"/>
    <text x="700" y="134" text-anchor="middle" fill="#2b3a55" font-size="18">patterns</text>
    <text x="700" y="178" fill="#7a8699" font-size="14">next token ↑</text>

    <!-- probability bar that grows -->
    <g>
      <rect x="760" y="92" width="14" height="80" fill="none" stroke="#a9bdd6" stroke-width="1"/>
      <rect x="762" y="152" width="10" height="18" fill="#ff8a3d">
        <animate attributeName="height" values="6;40;18;6" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="164;130;152;164" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="752" y="190" fill="#7a8699" font-size="13">P(t)</text>
    </g>
  </g>

  <text x="24" y="34" fill="#2b3a55" font-size="21" font-weight="bold">large language model — attention</text>
  <text x="24" y="288" fill="#7a8699" font-size="15">tokens → embeddings → attention → next token</text>
</svg>
