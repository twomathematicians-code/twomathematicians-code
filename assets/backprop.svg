<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" font-family="'Caveat','Comic Sans MS','Segoe Script',cursive" role="img" aria-label="Hand-drawn backpropagation gradient flow">
  <defs>
    <pattern id="grid-bp" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 L0 0 0 22" fill="none" stroke="#c9d6e8" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <pattern id="grid-major-bp" width="110" height="110" patternUnits="userSpaceOnUse">
      <path d="M110 0 L0 0 0 110" fill="none" stroke="#a9bdd6" stroke-width="0.9" opacity="0.4"/>
    </pattern>
    <filter id="ink-bp" x="-3%" y="-3%" width="106%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.014 0.02" numOctaves="2" seed="31" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.1"/>
    </filter>
  </defs>

  <rect width="480" height="280" fill="#f7f5ef"/>
  <rect width="480" height="280" fill="url(#grid-bp)"/>
  <rect width="480" height="280" fill="url(#grid-major-bp)"/>

  <g filter="url(#ink-bp)">
    <!-- forward edges (faint) -->
    <g stroke="#a9bdd6" stroke-width="1.2" fill="none" opacity="0.6">
      <line x1="70" y1="80" x2="220" y2="120"/>
      <line x1="70" y1="80" x2="220" y2="180"/>
      <line x1="70" y1="160" x2="220" y2="120"/>
      <line x1="70" y1="160" x2="220" y2="180"/>
      <line x1="70" y1="240" x2="220" y2="180"/>
      <line x1="240" y1="120" x2="380" y2="100"/>
      <line x1="240" y1="120" x2="380" y2="200"/>
      <line x1="240" y1="180" x2="380" y2="100"/>
      <line x1="240" y1="180" x2="380" y2="200"/>
    </g>

    <!-- backward gradient edges (red, animated dashes) -->
    <g stroke="#c0392b" stroke-width="2" fill="none" stroke-linecap="round">
      <line x1="380" y1="100" x2="240" y2="120" stroke-dasharray="8 240" stroke-dashoffset="240">
        <animate attributeName="stroke-dashoffset" values="240;0;240" keyTimes="0;0.4;1" dur="3.2s" repeatCount="indefinite"/>
      </line>
      <line x1="380" y1="200" x2="240" y2="180" stroke-dasharray="8 240" stroke-dashoffset="240">
        <animate attributeName="stroke-dashoffset" values="240;0;240" keyTimes="0;0.4;1" dur="3.2s" begin="0.5s" repeatCount="indefinite"/>
      </line>
      <line x1="240" y1="120" x2="70" y2="80" stroke-dasharray="8 240" stroke-dashoffset="240">
        <animate attributeName="stroke-dashoffset" values="240;0;240" keyTimes="0;0.4;1" dur="3.2s" begin="1s" repeatCount="indefinite"/>
      </line>
      <line x1="240" y1="180" x2="70" y2="160" stroke-dasharray="8 240" stroke-dashoffset="240">
        <animate attributeName="stroke-dashoffset" values="240;0;240" keyTimes="0;0.4;1" dur="3.2s" begin="1.5s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- nodes -->
    <g>
      <circle cx="60" cy="80" r="14" fill="#fff" stroke="#2b3a55" stroke-width="1.8"/>
      <circle cx="60" cy="160" r="14" fill="#fff" stroke="#2b3a55" stroke-width="1.8"/>
      <circle cx="60" cy="240" r="14" fill="#fff" stroke="#2b3a55" stroke-width="1.8"/>
      <circle cx="230" cy="120" r="14" fill="#fff" stroke="#2b3a55" stroke-width="1.8"/>
      <circle cx="230" cy="180" r="14" fill="#fff" stroke="#2b3a55" stroke-width="1.8"/>
      <circle cx="390" cy="100" r="14" fill="#fff" stroke="#c0392b" stroke-width="2.2"/>
      <circle cx="390" cy="200" r="14" fill="#fff" stroke="#c0392b" stroke-width="2.2"/>
    </g>

    <text x="40" y="60" fill="#3b5998" font-size="15">forward →</text>
    <text x="300" y="260" fill="#c0392b" font-size="15">← backward ∇</text>
    <text x="300" y="60" fill="#7a8699" font-size="14">δ = ∂L/∂a</text>
  </g>

  <text x="20" y="32" fill="#2b3a55" font-size="20" font-weight="bold">backpropagation</text>
</svg>
