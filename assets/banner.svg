<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 200" font-family="'Caveat','Comic Sans MS','Segoe Script',cursive" role="img" aria-label="Hand-drawn banner: Mahesh Solanki, ML Engineer">
  <defs>
    <pattern id="grid-ban" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 L0 0 0 22" fill="none" stroke="#c9d6e8" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <pattern id="grid-major-ban" width="110" height="110" patternUnits="userSpaceOnUse">
      <path d="M110 0 L0 0 0 110" fill="none" stroke="#a9bdd6" stroke-width="0.9" opacity="0.4"/>
    </pattern>
    <filter id="ink-ban" x="-2%" y="-2%" width="104%" height="108%">
      <feTurbulence type="turbulence" baseFrequency="0.01 0.016" numOctaves="2" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.6"/>
    </filter>
  </defs>

  <rect width="940" height="200" fill="#f7f5ef"/>
  <rect width="940" height="200" fill="url(#grid-ban)"/>
  <rect width="940" height="200" fill="url(#grid-major-ban)"/>
  <ellipse cx="880" cy="160" rx="50" ry="32" fill="#d9c08a" opacity="0.10"/>

  <g filter="url(#ink-ban)">
    <!-- handwritten name -->
    <text x="470" y="92" text-anchor="middle" fill="#2b3a55" font-size="64" font-weight="bold">Mahesh Solanki</text>
    <!-- role line -->
    <text x="470" y="128" text-anchor="middle" fill="#c0392b" font-size="28">ML Engineer · Production AI · Mathematics ⊕ Code</text>

    <!-- underline scribble -->
    <path d="M250 104 q 110 -10 220 0 t 220 0" fill="none" stroke="#ff8a3d" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- corner sketches: integral and small neuron -->
  <g opacity="0.85" font-family="'Caveat',cursive">
    <text x="40" y="60" fill="#3b5998" font-size="40">∫</text>
    <text x="44" y="92" fill="#7a8699" font-size="16">f(x)dx</text>
    <text x="860" y="58" fill="#1e6b3a" font-size="28">∂L/∂w</text>
  </g>
</svg>
