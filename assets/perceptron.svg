<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" font-family="'Inter','Segoe UI',system-ui,sans-serif" role="img" aria-label="Perceptron diagram with activation function">
  <!-- clean white background -->
  <rect width="440" height="280" fill="#ffffff"/>

  <!-- inputs -->
  <circle cx="60" cy="80" r="15" fill="#f8fafc" stroke="#6366F1" stroke-width="1.5"/>
  <circle cx="60" cy="160" r="15" fill="#f8fafc" stroke="#6366F1" stroke-width="1.5"/>
  <circle cx="60" cy="240" r="15" fill="#f8fafc" stroke="#6366F1" stroke-width="1.5"/>
  <text x="34" y="86" fill="#64748b" font-size="14">x₁</text>
  <text x="34" y="166" fill="#64748b" font-size="14">x₂</text>
  <text x="34" y="246" fill="#64748b" font-size="14">x₃</text>

  <!-- weighted edges -->
  <g stroke="#3b82f6" stroke-width="1.4" fill="none" opacity="0.5">
    <line x1="75" y1="80" x2="245" y2="160"/>
    <line x1="75" y1="160" x2="245" y2="160"/>
    <line x1="75" y1="240" x2="245" y2="160"/>
  </g>
  <!-- weight labels -->
  <text x="140" y="112" fill="#ef4444" font-size="13" font-weight="500">w₁</text>
  <text x="140" y="156" fill="#ef4444" font-size="13" font-weight="500">w₂</text>
  <text x="140" y="208" fill="#ef4444" font-size="13" font-weight="500">w₃</text>

  <!-- summation node -->
  <circle cx="260" cy="160" r="26" fill="#f8fafc" stroke="#6366F1" stroke-width="1.5"/>
  <text x="252" y="167" fill="#6366F1" font-size="20" font-weight="600">&Sigma;</text>
  <text x="238" y="118" fill="#64748b" font-size="12">z = &Sigma;wᵢxᵢ + b</text>

  <!-- arrow to activation -->
  <line x1="286" y1="160" x2="318" y2="160" stroke="#1e293b" stroke-width="1.4"/>
  <polygon points="318,160 310,156 310,164" fill="#1e293b"/>

  <!-- activation sigmoid curve -->
  <path d="M335 100 C 360 100, 360 220, 385 220" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="318" y="96" fill="#22c55e" font-size="13" font-weight="500">&sigma;(z)</text>

  <!-- output node -->
  <circle cx="400" cy="160" r="15" fill="#f8fafc" stroke="#22c55e" stroke-width="1.5"/>
  <text x="393" y="166" fill="#22c55e" font-size="13" font-weight="500">ŷ</text>

  <!-- title -->
  <text x="24" y="36" fill="#1e293b" font-size="16" font-weight="600" letter-spacing="0.5">THE PERCEPTRON</text>
  <text x="24" y="272" fill="#64748b" font-size="12">weighted sum &rarr; activation &rarr; output</text>
</svg>
