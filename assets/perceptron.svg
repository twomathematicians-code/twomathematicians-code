<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" font-family="'Caveat','Comic Sans MS','Segoe Script',cursive" role="img" aria-label="Hand-drawn perceptron with activation function">
  <defs>
    <pattern id="grid-pc" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 L0 0 0 22" fill="none" stroke="#c9d6e8" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <pattern id="grid-major-pc" width="110" height="110" patternUnits="userSpaceOnUse">
      <path d="M110 0 L0 0 0 110" fill="none" stroke="#a9bdd6" stroke-width="0.9" opacity="0.45"/>
    </pattern>
    <filter id="ink-pc" x="-4%" y="-4%" width="108%" height="112%">
      <feTurbulence type="turbulence" baseFrequency="0.014 0.02" numOctaves="2" seed="11" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.2"/>
    </filter>
  </defs>

  <rect width="440" height="280" fill="#f7f5ef"/>
  <rect width="440" height="280" fill="url(#grid-pc)"/>
  <rect width="440" height="280" fill="url(#grid-major-pc)"/>

  <g filter="url(#ink-pc)">
    <!-- inputs -->
    <circle cx="60" cy="80" r="15" fill="#fff" stroke="#2b3a55" stroke-width="2"/>
    <circle cx="60" cy="160" r="15" fill="#fff" stroke="#2b3a55" stroke-width="2"/>
    <circle cx="60" cy="240" r="15" fill="#fff" stroke="#2b3a55" stroke-width="2"/>
    <text x="34" y="86" fill="#7a8699" font-size="16">x₁</text>
    <text x="34" y="166" fill="#7a8699" font-size="16">x₂</text>
    <text x="34" y="246" fill="#7a8699" font-size="16">x₃</text>

    <!-- weighted edges -->
    <g stroke="#3b5998" stroke-width="1.6" fill="none" opacity="0.7">
      <line x1="75" y1="80" x2="245" y2="160"/>
      <line x1="75" y1="160" x2="245" y2="160"/>
      <line x1="75" y1="240" x2="245" y2="160"/>
    </g>
    <!-- weight labels -->
    <text x="135" y="112" fill="#c0392b" font-size="16">w₁</text>
    <text x="135" y="156" fill="#c0392b" font-size="16">w₂</text>
    <text x="135" y="208" fill="#c0392b" font-size="16">w₃</text>

    <!-- summation -->
    <circle cx="260" cy="160" r="26" fill="#fff" stroke="#2b3a55" stroke-width="2"/>
    <text x="252" y="168" fill="#2b3a55" font-size="22">Σ</text>
    <text x="238" y="118" fill="#7a8699" font-size="14">z = Σwᵢxᵢ + b</text>

    <!-- arrow to activation -->
    <line x1="286" y1="160" x2="318" y2="160" stroke="#2b3a55" stroke-width="1.6"/>
    <polygon points="318,160 310,156 310,164" fill="#2b3a55"/>

    <!-- activation sigmoid curve drawn as path -->
    <path d="M335 100 C 360 100, 360 220, 385 220" fill="none" stroke="#1e6b3a" stroke-width="2.4"/>
    <text x="316" y="96" fill="#1e6b3a" font-size="15">σ(z)</text>

    <!-- output node -->
    <circle cx="400" cy="160" r="15" fill="#fff" stroke="#1e6b3a" stroke-width="2.4"/>
    <text x="392" y="166" fill="#1e6b3a" font-size="14">ŷ</text>
  </g>

  <!-- title -->
  <text x="24" y="36" fill="#2b3a55" font-size="21" font-weight="bold">the perceptron</text>
  <text x="24" y="272" fill="#7a8699" font-size="15">weighted sum → activation → output</text>
</svg>
