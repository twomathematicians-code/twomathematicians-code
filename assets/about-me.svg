<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 190" font-family="'Caveat','Comic Sans MS','Segoe Script',cursive" role="img" aria-label="About me, hand-written note"><defs><pattern id="g1" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0 L0 0 0 22" fill="none" stroke="#c9d6e8" stroke-width="0.6" opacity="0.5"/></pattern><pattern id="G1" width="110" height="110" patternUnits="userSpaceOnUse"><path d="M110 0 L0 0 0 110" fill="none" stroke="#a9bdd6" stroke-width="0.9" opacity="0.4"/></pattern><filter id="ink1" x="-3%" y="-3%" width="106%" height="112%"><feTurbulence type="turbulence" baseFrequency="0.013 0.019" numOctaves="2" seed="1" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="2.1"/></filter></defs><rect width="820" height="190" fill="#f7f5ef"/><rect width="820" height="190" fill="url(#g1)"/><rect width="820" height="190" fill="url(#G1)"/><line x1="70" y1="20" x2="70" y2="170" stroke="#e6a8a8" stroke-width="1.4" opacity="0.7"/><text x="96" y="52" fill="#c0392b" font-size="30" filter="url(#ink1)">About Me</text><g filter="url(#ink1)"><text x="96" y="92" fill="#2b3a55" font-size="25">I build production ML systems the way a mathematician</text><text x="96" y="108" fill="#2b3a55" font-size="25">solves a problem — from first principles.</text><text x="96" y="124" fill="#3b5998" font-size="25">Python · FastAPI · Docker · PostgreSQL, wired into CI/CD</text><text x="96" y="140" fill="#3b5998" font-size="25">pipelines that ship.</text><text x="96" y="156" fill="#1e6b3a" font-size="25">My notebooks move between calculus, probability,</text><text x="96" y="172" fill="#1e6b3a" font-size="25">and deployed inference APIs.</text></g><ellipse cx="770" cy="40" rx="40" ry="26" fill="#d9c08a" opacity="0.10"/></svg>