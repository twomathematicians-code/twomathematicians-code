<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="'Caveat','Comic Sans MS','Segoe Script',cursive" role="img" aria-label="Hand-drawn training loss curve being sketched">
  <defs>
    <pattern id="grid-lc" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#c9d6e8" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <pattern id="grid-major-lc" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0 L0 0 0 100" fill="none" stroke="#a9bdd6" stroke-width="0.9" opacity="0.45"/>
    </pattern>
    <filter id="ink-lc" x="-3%" y="-3%" width="106%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.015 0.022" numOctaves="2" seed="19" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.0"/>
    </filter>
  </defs>

  <rect width="480" height="300" fill="#f7f5ef"/>
  <rect width="480" height="300" fill="url(#grid-lc)"/>
  <rect width="480" height="300" fill="url(#grid-major-lc)"/>

  <g filter="url(#ink-lc)">
    <!-- axes -->
    <path d="M60 260 L60 50" fill="none" stroke="#2b3a55" stroke-width="2"/>
    <path d="M60 260 L450 260" fill="none" stroke="#2b3a55" stroke-width="2"/>
    <!-- axis arrows -->
    <polygon points="60,42 56,54 64,54" fill="#2b3a55"/>
    <polygon points="458,260 446,256 446,264" fill="#2b3a55"/>

    <!-- axis labels -->
    <text x="40" y="56" fill="#2b3a55" font-size="16">loss</text>
    <text x="430" y="282" fill="#2b3a55" font-size="16">epoch</text>
    <text x="20" y="270" fill="#7a8699" font-size="14">0</text>
    <text x="430" y="278" fill="#7a8699" font-size="14">N</text>

    <!-- gridline ticks on y -->
    <g stroke="#a9bdd6" stroke-width="0.7" opacity="0.6">
      <line x1="56" y1="100" x2="60" y2="100"/>
      <line x1="56" y1="160" x2="60" y2="160"/>
      <line x1="56" y1="220" x2="60" y2="220"/>
    </g>

    <!-- the loss curve: exponential decay with a bump -->
    <path id="losspath" d="M60 70 C 110 95, 130 120, 160 150 C 200 185, 230 205, 270 218 C 320 232, 360 238, 410 240 C 425 241, 440 241, 450 242"
          fill="none" stroke="#c0392b" stroke-width="2.6" stroke-linecap="round"
          stroke-dasharray="900" stroke-dashoffset="900">
      <animate attributeName="stroke-dashoffset" from="900" to="0" dur="5s" repeatCount="indefinite"/>
    </path>

    <!-- moving dot along the curve -->
    <circle r="5" fill="#ff5a5f" stroke="#7a1f1c" stroke-width="1">
      <animateMotion dur="5s" repeatCount="indefinite">
        <mpath href="#losspath"/>
      </animateMotion>
    </circle>

    <!-- "you are here" annotation -->
    <g opacity="0.9">
      <line x1="250" y1="200" x2="270" y2="150" stroke="#2b3a55" stroke-width="1.2"/>
      <text x="180" y="146" fill="#2b3a55" font-size="15">gradient descent ↓</text>
    </g>
    <!-- convergence note -->
    <text x="300" y="256" fill="#1e6b3a" font-size="15">→ converges</text>
  </g>

  <!-- title -->
  <text x="24" y="34" fill="#2b3a55" font-size="20" font-weight="bold">training loss</text>
</svg>
