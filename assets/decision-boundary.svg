<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" font-family="'Caveat','Comic Sans MS','Segoe Script',cursive" role="img" aria-label="Hand-drawn decision boundary separating two classes">
  <defs>
    <pattern id="grid-db" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#c9d6e8" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <pattern id="grid-major-db" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0 L0 0 0 100" fill="none" stroke="#a9bdd6" stroke-width="0.9" opacity="0.45"/>
    </pattern>
    <filter id="ink-db" x="-3%" y="-3%" width="106%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.015 0.022" numOctaves="2" seed="23" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.0"/>
    </filter>
  </defs>

  <rect width="440" height="300" fill="#f7f5ef"/>
  <rect width="440" height="300" fill="url(#grid-db)"/>
  <rect width="440" height="300" fill="url(#grid-major-db)"/>

  <g filter="url(#ink-db)">
    <!-- axes -->
    <path d="M50 250 L50 40" fill="none" stroke="#2b3a55" stroke-width="1.6"/>
    <path d="M50 250 L420 250" fill="none" stroke="#2b3a55" stroke-width="1.6"/>
    <text x="30" y="46" fill="#2b3a55" font-size="15">feature₂</text>
    <text x="380" y="272" fill="#2b3a55" font-size="15">feature₁</text>

    <!-- decision boundary (wavy hand-drawn) -->
    <path d="M60 80 C 140 120, 180 150, 250 165 C 320 180, 370 210, 410 230"
          fill="none" stroke="#3b5998" stroke-width="2.4" stroke-linecap="round"
          stroke-dasharray="620" stroke-dashoffset="620">
      <animate attributeName="stroke-dashoffset" from="620" to="0" dur="4s" repeatCount="indefinite"/>
    </path>
    <text x="150" y="120" fill="#3b5998" font-size="15">w·x + b = 0</text>

    <!-- class A points (above boundary, red circles) -->
    <g fill="none" stroke="#c0392b" stroke-width="2">
      <circle cx="100" cy="70" r="7"/>
      <circle cx="160" cy="60" r="7"/>
      <circle cx="220" cy="95" r="7"/>
      <circle cx="140" cy="110" r="7"/>
      <circle cx="280" cy="120" r="7"/>
      <circle cx="90" cy="100" r="7"/>
    </g>
    <text x="78" y="48" fill="#c0392b" font-size="14">class A</text>

    <!-- class B points (below boundary, blue crosses) -->
    <g stroke="#1e6b3a" stroke-width="2">
      <line x1="168" y1="180" x2="180" y2="192"/><line x1="180" y1="180" x2="168" y2="192"/>
      <line x1="218" y1="208" x2="230" y2="220"/><line x1="230" y1="208" x2="218" y2="220"/>
      <line x1="288" y1="195" x2="300" y2="207"/><line x1="300" y1="195" x2="288" y2="207"/>
      <line x1="338" y1="225" x2="350" y2="237"/><line x1="350" y1="225" x2="338" y2="237"/>
      <line x1="120" y1="205" x2="132" y2="217"/><line x1="132" y1="205" x2="120" y2="217"/>
    </g>
    <text x="330" y="288" fill="#1e6b3a" font-size="14">class B</text>
  </g>

  <!-- title -->
  <text x="20" y="32" fill="#2b3a55" font-size="20" font-weight="bold">decision boundary</text>
</svg>
