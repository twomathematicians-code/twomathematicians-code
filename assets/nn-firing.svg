<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="'Caveat','Comic Sans MS','Segoe Script',cursive" role="img" aria-label="Hand-drawn neural network with firing neurons">
  <defs>
    <!-- graph paper grid -->
    <pattern id="grid-nn" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 L0 0 0 22" fill="none" stroke="#c9d6e8" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <pattern id="grid-major-nn" width="110" height="110" patternUnits="userSpaceOnUse">
      <path d="M110 0 L0 0 0 110" fill="none" stroke="#a9bdd6" stroke-width="0.9" opacity="0.45"/>
    </pattern>
    <filter id="ink-wobble-nn" x="-2%" y="-2%" width="104%" height="108%">
      <feTurbulence type="turbulence" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.4"/>
    </filter>
    <radialGradient id="fire-nn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5a5f" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- paper -->
  <rect width="880" height="320" fill="#f7f5ef"/>
  <rect width="880" height="320" fill="url(#grid-nn)"/>
  <rect width="880" height="320" fill="url(#grid-major-nn)"/>
  <!-- coffee stain -->
  <ellipse cx="828" cy="44" rx="46" ry="30" fill="#d9c08a" opacity="0.10"/>
  <ellipse cx="828" cy="44" rx="32" ry="20" fill="#d9c08a" opacity="0.10"/>

  <!-- layer labels (handwritten) -->
  <text x="56" y="36" fill="#2b3a55" font-size="20">input</text>
  <text x="356" y="36" fill="#2b3a55" font-size="20">hidden</text>
  <text x="656" y="36" fill="#2b3a55" font-size="20">output</text>
  <text x="372" y="58" fill="#7a8699" font-size="15">σ(z) = 1 / (1 + e⁻ᶻ)</text>

  <g filter="url(#ink-wobble-nn)">
    <!-- edges (drawn first, behind nodes) -->
    <g stroke="#3b5998" stroke-width="1.5" fill="none" opacity="0.62">
      <!-- input(3) -> hidden(4) -->
      <line x1="110" y1="120" x2="430" y2="90"/>
      <line x1="110" y1="120" x2="430" y2="170"/>
      <line x1="110" y1="120" x2="430" y2="250"/>
      <line x1="110" y1="200" x2="430" y2="90"/>
      <line x1="110" y1="200" x2="430" y2="170"/>
      <line x1="110" y1="200" x2="430" y2="250"/>
      <line x1="110" y1="280" x2="430" y2="90"/>
      <line x1="110" y1="280" x2="430" y2="170"/>
      <line x1="110" y1="280" x2="430" y2="250"/>
      <!-- hidden(4) -> output(2) -->
      <line x1="450" y1="90" x2="750" y2="160"/>
      <line x1="450" y1="90" x2="750" y2="240"/>
      <line x1="450" y1="170" x2="750" y2="160"/>
      <line x1="450" y1="170" x2="750" y2="240"/>
      <line x1="450" y1="250" x2="750" y2="160"/>
      <line x1="450" y1="250" x2="750" y2="240"/>
    </g>

    <!-- firing pulse along a few edges -->
    <g fill="none" stroke="#ff5a5f" stroke-width="2.6" stroke-linecap="round">
      <line x1="110" y1="200" x2="430" y2="170" stroke-dasharray="8 600" stroke-dashoffset="600">
        <animate attributeName="stroke-dashoffset" values="600;0;600" keyTimes="0;0.45;1" dur="3.6s" repeatCount="indefinite"/>
      </line>
      <line x1="450" y1="170" x2="750" y2="160" stroke-dasharray="8 400" stroke-dashoffset="400">
        <animate attributeName="stroke-dashoffset" values="400;0;400" keyTimes="0;0.55;1" dur="3.6s" begin="1.4s" repeatCount="indefinite"/>
      </line>
      <line x1="110" y1="120" x2="430" y2="90" stroke-dasharray="8 600" stroke-dashoffset="600">
        <animate attributeName="stroke-dashoffset" values="600;0;600" keyTimes="0;0.4;1" dur="4.2s" begin="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="450" y1="250" x2="750" y2="240" stroke-dasharray="8 400" stroke-dashoffset="400">
        <animate attributeName="stroke-dashoffset" values="400;0;400" keyTimes="0;0.5;1" dur="4.2s" begin="2.1s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- nodes -->
    <g>
      <!-- input -->
      <circle cx="90" cy="120" r="17" fill="#fff" stroke="#2b3a55" stroke-width="2"/>
      <circle cx="90" cy="200" r="17" fill="#fff" stroke="#2b3a55" stroke-width="2"/>
      <circle cx="90" cy="280" r="17" fill="#fff" stroke="#2b3a55" stroke-width="2"/>
      <!-- hidden (with firing glow) -->
      <circle cx="440" cy="90" r="16" fill="url(#fire-nn)" opacity="0.85">
        <animate attributeName="opacity" values="0.15;0.95;0.15" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="440" cy="170" r="16" fill="url(#fire-nn)" opacity="0.85">
        <animate attributeName="opacity" values="0.95;0.15;0.95" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="440" cy="250" r="16" fill="url(#fire-nn)" opacity="0.85">
        <animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.1s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="440" cy="90" r="16" fill="none" stroke="#c0392b" stroke-width="2"/>
      <circle cx="440" cy="170" r="16" fill="none" stroke="#c0392b" stroke-width="2"/>
      <circle cx="440" cy="250" r="16" fill="none" stroke="#c0392b" stroke-width="2"/>
      <!-- output -->
      <circle cx="760" cy="160" r="18" fill="#fff" stroke="#1e6b3a" stroke-width="2.4"/>
      <circle cx="760" cy="240" r="18" fill="#fff" stroke="#1e6b3a" stroke-width="2.4"/>
      <!-- output value ticks -->
      <text x="786" y="166" fill="#1e6b3a" font-size="15">ŷ = 0.93</text>
      <text x="786" y="246" fill="#7a8699" font-size="15">ŷ = 0.07</text>
    </g>

    <!-- small annotations -->
    <text x="64" y="125" fill="#7a8699" font-size="15">x₁</text>
    <text x="64" y="205" fill="#7a8699" font-size="15">x₂</text>
    <text x="64" y="285" fill="#7a8699" font-size="15">x₃</text>
    <text x="452" y="96" fill="#7a8699" font-size="14">w·x+b</text>
  </g>

  <!-- title -->
  <text x="32" y="312" fill="#2b3a55" font-size="22" font-weight="bold">neural network — forward pass</text>
</svg>
