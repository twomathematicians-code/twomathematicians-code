<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" font-family="'Caveat','Comic Sans MS','Segoe Script',cursive" role="img" aria-label="Hand-written mathematical equations cycling in motion">
  <defs>
    <pattern id="grid-eq" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 L0 0 0 22" fill="none" stroke="#c9d6e8" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="760" height="200" fill="#f7f5ef"/>
  <rect width="760" height="200" fill="url(#grid-eq)"/>

  <!-- four equations, each fades in/out in sequence -->
  <g text-anchor="middle" fill="#2b3a55">
    <!-- Bayes -->
    <g font-size="34">
      <text x="380" y="70" opacity="0">
        P(A|B) = P(B|A)·P(A) / P(B)
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.23;0.25" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="380" y="108" fill="#7a8699" font-size="20" opacity="0">
        — Bayes' theorem —
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.23;0.25" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- Gradient descent -->
    <g font-size="34">
      <text x="380" y="70" opacity="0">
        θ ← θ − η · ∇L(θ)
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.25;0.37;0.48;0.5" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="380" y="108" fill="#7a8699" font-size="20" opacity="0">
        — gradient descent —
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.25;0.37;0.48;0.5" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- Attention -->
    <g font-size="34">
      <text x="380" y="70" opacity="0">
        Attention(Q,K,V) = softmax(QKᵀ/√d)V
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.5;0.62;0.73;0.75" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="380" y="108" fill="#7a8699" font-size="20" opacity="0">
        — scaled dot-product attention —
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.5;0.62;0.73;0.75" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- Normal distribution -->
    <g font-size="34">
      <text x="380" y="70" opacity="0">
        𝒩(μ,σ²) = (1/σ√2π)·e^(−(x−μ)²/2σ²)
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.75;0.87;0.98;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="380" y="108" fill="#7a8699" font-size="20" opacity="0">
        — the normal distribution —
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.75;0.87;0.98;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- scribble underline that drifts -->
  <path d="M250 132 q 60 -8 130 0 t 130 0" fill="none" stroke="#ff8a3d" stroke-width="2.4" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.85;0.3" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- chalk dust dots -->
  <g fill="#a9bdd6">
    <circle cx="120" cy="40" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="160" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="50" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="170" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>

  <text x="20" y="28" fill="#2b3a55" font-size="20" font-weight="bold">equations in motion</text>
</svg>
